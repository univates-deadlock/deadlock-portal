name: CI — Validate portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate links and required files
        run: python3 tests/check_site.py

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build and start site
        run: docker compose up -d --build --wait

      - name: Smoke test HTTP and health
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8081/health | grep -qx 'ok'
          curl --fail --silent --show-error http://127.0.0.1:8081/ | grep -q 'Deadlock'
          curl --fail --silent --show-error http://127.0.0.1:8081/css/style.css > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/not-a-real-page)" = '404'

      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 || true

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
